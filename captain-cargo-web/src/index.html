<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Captain Cargo International</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Captain Cargo International ships air, sea and land cargo from Saudi Arabia to the world, with doorstep pickup, real-time tracking and the Captain Logistic app."
    />
    <meta name="theme-color" content="#ebf5ff" />
    <!-- Captain favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/captain-logo.png"
    />

    <!-- Better support for Apple devices -->
    <link
      rel="apple-touch-icon"
      href="/captain-logo.png"
    />

    <!-- Geist (UI/body) from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
    />
    <!--
      Display face: the style reference uses Aeonik (licensed).
      General Sans (free, Fontshare) is the stand-in until an Aeonik licence is added.
      If you self-host Aeonik, add its @font-face in styles.css — it is already first in the stack.
    -->
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=general-sans@500&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
